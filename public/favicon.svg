<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Matches the cursor dot: orange in both modes, the way the accent behaves
       everywhere else on the site. The two values are the palette's own accent
       steps — #ff4103 on light, lifted to #ff5c26 on dark, where the darker
       orange loses its bite. -->
  <style>
    circle { fill: #ff4103; }
    @media (prefers-color-scheme: dark) {
      circle { fill: #ff5c26; }
    }
  </style>
  <circle cx="16" cy="16" r="9" />
</svg>
