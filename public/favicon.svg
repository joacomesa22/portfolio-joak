<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Matches the cursor dot. Fill flips with the OS theme, so the mark stays
       visible on both a light and a dark browser tab. -->
  <style>
    circle { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      circle { fill: #f2f1ec; }
    }
  </style>
  <circle cx="16" cy="16" r="9" />
</svg>
